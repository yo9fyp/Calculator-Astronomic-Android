
name: Publicare APK in Releases

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca APK din ultima compilare reusita
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-apk.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Nu exista o compilare reusita."
            exit 1
          fi

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name Calculator-Astronomic-APK \
            --dir release-apk

      - name: Publica APK in versiunea v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-apk/
          gh release upload v1.0 release-apk/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
