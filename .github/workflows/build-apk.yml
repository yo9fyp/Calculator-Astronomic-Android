
name: Construire APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza dependintele
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake
          python3 -m pip install --user buildozer cython==0.29.34
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construieste aplicatia Android
        run: buildozer android debug

      - name: Salveaza APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Astronomic-APK
          path: bin/*.apk
          if-no-files-found: error
